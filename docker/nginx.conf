# Serves the static dashboard and reverse-proxies /api/* to the backend
# container by service name -- the browser only ever talks to this origin,
# so the dashboard's JS (frontend/app.js) never needs CORS or a hardcoded
# backend host/port.
server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
