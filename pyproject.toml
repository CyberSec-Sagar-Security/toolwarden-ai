[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolwarden-ai"
version = "0.1.0"
description = "Interception firewall between an AI agent and the tools it calls"
requires-python = ">=3.11"
# Runtime deps for USING the library (Classifier + enforcement + the direct-API
# adapter) -- deliberately narrower than requirements.txt, which pins this
# repo's own exact training/benchmarking environment (agentdojo, shap,
# matplotlib, datasets, accelerate, a CUDA-specific torch build) that a
# downstream consumer guarding their own agent has no reason to install.
dependencies = [
    "openai==1.109.1",
    # requirements.txt pins an exact CUDA build (torch==2.13.0+cu132) for this
    # repo's own training reproducibility; a library consumer's hardware/CUDA
    # setup is outside this project's control, so only a floor is set here.
    "torch>=2.13",
    # Exact pin kept here too, not just in requirements.txt: transformers 5.15.0
    # has a confirmed NaN-gradient regression fine-tuning DeBERTa-v2/v3 (see
    # requirements.txt's comment) -- loading the fine-tuned checkpoint at
    # inference time is untested against 5.x and not worth risking.
    "transformers==4.46.3",
    "sentencepiece==0.2.2",
    "protobuf==7.35.1",
    "lightgbm==4.7.0",
    "scikit-learn==1.9.0",
    # Classifier.score_and_explain() (Phase 13's explainability-wiring fix)
    # calls explain_lightgbm() -> shap.TreeExplainer in the live decision
    # path, not just Phase 5's offline spot-check -- shap moved here from
    # the train-only extra below. Caught via a real Docker container run
    # (ModuleNotFoundError: shap), not assumed: the dev venv's
    # requirements.txt installs shap unconditionally, so this gap was
    # invisible until something installed via pyproject.toml's own
    # dependency list actually exercised the code path.
    "shap==0.52.0",
]

[project.optional-dependencies]
# The MCP adapter (toolwarden.mcp_proxy) -- not re-exported from the top-level
# package precisely so this stays optional (see src/toolwarden/__init__.py).
mcp = ["mcp[cli]==2.0.0"]
# The Anthropic adapter (toolwarden.demo.guarded_loop_anthropic) -- optional
# for the same reason mcp is: not every consumer needs every adapter.
# openai stays a hard dependency (an existing, unchanged pin from Phase 2/11);
# not retroactively changed here to keep this addition minimal.
anthropic = ["anthropic==0.121.0"]
# Phase 12's FastAPI backend (toolwarden.service) -- only needed to run the
# deployable HTTP service, not to use toolwarden as a library.
service = ["fastapi==0.141.1", "uvicorn[standard]==0.52.1", "psycopg[binary]==3.3.4", "psycopg_pool==3.3.1"]
# This repo's own dev tooling, not needed to use the library.
dev = ["pytest==8.3.4", "ruff==0.8.4"]
# Training/benchmarking/red-teaming this repo's own classifier from scratch --
# not needed to use an already-trained model via the public API. (shap moved
# to base dependencies above -- it's needed for inference-time explainability
# now, not just training-time SHAP analysis.)
train = ["agentdojo==0.1.35", "accelerate==1.14.0", "datasets==5.0.1", "matplotlib==3.11.1"]

[tool.setuptools.packages.find]
where = ["src"]

# setuptools doesn't bundle non-.py files by default -- schema.sql (Phase
# 12's Postgres schema, loaded at runtime via Path(__file__).with_name(...)
# in service/db.py) needs to actually ship inside the installed package,
# not just exist in the source tree. Caught via a real `docker build` +
# container run, not assumed correct (same discipline as Phase 11's
# fresh-venv verification): the backend container crashed on startup with
# a FileNotFoundError for this exact file before this was added.
[tool.setuptools.package-data]
"toolwarden.service" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
